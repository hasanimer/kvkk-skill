name: Yayın paketi

# v ile başlayan bir etiket itildiğinde kvkk.zip üretir ve aynı etiketin
# yayınına ekler. Zip içinde üst klasör kvkk/ olur.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Doğrula ve test et
        run: |
          python3 tools/dogrula.py
          python3 -m unittest discover -s tests
      - name: Etiket ile beceri sürümünü karşılaştır
        run: |
          surum=$(python3 tools/dogrula.py --surum)
          if [ -z "$surum" ] || [ "v$surum" != "$GITHUB_REF_NAME" ]; then
            echo "Etiket $GITHUB_REF_NAME, SKILL.md sürümü '${surum:-okunamadı}'. Etiket v<metadata.version> olmalı." >&2
            exit 1
          fi
      - name: CHANGELOG bölümü yayımlanmış mı
        run: |
          surum="${GITHUB_REF_NAME#v}"
          bolum=$(awk -v b="## $surum" '$0 == b {ic=1; next} /^## / {ic=0} ic' CHANGELOG.md)
          if printf '%s\n' "$bolum" | grep -q 'Yayımlanmadı'; then
            echo "CHANGELOG.md: $surum bölümü hâlâ 'Yayımlanmadı' diyor; yayın tarihini yazıp etiketi yeniden itin." >&2
            exit 1
          fi
      - name: kvkk.zip üret
        run: |
          cd skills
          zip -r ../kvkk.zip kvkk -x '*/__pycache__/*' '*.pyc'
          unzip -l ../kvkk.zip
      - name: Yayına ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" kvkk.zip --clobber
          else
            ek=()
            case "$GITHUB_REF_NAME" in
              *-*) ek=(--prerelease --latest=false) ;;
            esac
            gh release create "$GITHUB_REF_NAME" kvkk.zip --verify-tag --title "KVKK Skill $GITHUB_REF_NAME" --generate-notes "${ek[@]}"
          fi
