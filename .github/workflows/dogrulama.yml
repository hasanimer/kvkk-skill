name: Doğrulama

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  yapi-ve-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paket yapısı ve iç bağlantılar
        run: python3 tools/dogrula.py
      - name: Süre hesaplayıcı testleri
        run: python3 -m unittest discover -s tests -v
